const LAT_MAX = 43.85, LAT_SPAN = 0.90, LON_MAX = 88.40, LON_SPAN = 0.75;
const MAP_W = 340, MAP_H = 310, PAD = 28;
const WORK_W = MAP_W - PAD * 2, WORK_H = MAP_H - PAD * 2;

function toXY(lat, lon) {
  return { x: ((LON_MAX - lon) / LON_SPAN) * WORK_W + PAD, y: ((LAT_MAX - lat) / LAT_SPAN) * WORK_H + PAD };
}
function miToRxy(miles) {
  return { rx: (miles / (LON_SPAN * 50.1)) * WORK_W, ry: (miles / (LAT_SPAN * 69.0)) * WORK_H };
}

function CommunityMap({ selectedId, communities, dirStyle, onSelect }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef({});
  const boundsRef = useRef(null);
  const onSelectRef = useRef(onSelect);
  useEffect(() => { onSelectRef.current = onSelect; }, [onSelect]);

  // Coords come directly from each community's lat/lng fields — no separate list needed
  const COORDS = Object.fromEntries(communities.map(c => [c.id, [c.lat, c.lng]]));

  function dotIcon(bg, size, ring) {
    const r = ring ? "box-shadow:0 0 0 5px " + bg + "33,0 1px 5px rgba(0,0,0,0.35);" : "box-shadow:0 1px 4px rgba(0,0,0,0.3);";
    return L.divIcon({
      html: '<div style="background:' + bg + ';width:' + size + 'px;height:' + size + 'px;border-radius:50%;border:2px solid white;' + r + '"></div>',
      className: '', iconSize: [size, size], iconAnchor: [size/2, size/2], tooltipAnchor: [size/2 + 2, 0],
    });
  }

  function wbIcon() {
    return L.divIcon({
      html: '<div style="background:#F59E0B;width:18px;height:18px;border-radius:50%;border:2.5px solid white;box-shadow:0 1px 5px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:18px;text-align:center;color:white;font-weight:800;">&#9733;</div>',
      className: '', iconSize: [18, 18], iconAnchor: [9, 9], tooltipAnchor: [11, 0],
    });
  }

  // Init map once
  useEffect(() => {
    if (!containerRef.current || mapRef.current) return;
    const map = L.map(containerRef.current, {
      zoomControl: true, scrollWheelZoom: false,
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
      maxZoom: 18,
    }).addTo(map);

    // Distance rings
    [15, 30].forEach((mi, i) => {
      L.circle([43.4253, -88.1834], {
        radius: mi * 1609.34, color: '#94A3B8',
        weight: 1, dashArray: i === 0 ? '4,4' : '6,5',
        fill: false, opacity: i === 0 ? 0.6 : 0.45,
      }).addTo(map);
    });

    // West Bend
    const wb = L.marker([43.4253, -88.1834], { icon: wbIcon(), zIndexOffset: 2000 })
      .addTo(map)
      .bindTooltip('West Bend — USCCA Offices', { direction: 'right', className: 'map-tip' });
    wb.on('click', () => onSelectRef.current('wb'));
    markersRef.current['wb'] = wb;

    // Community markers
    communities.forEach(com => {
      if (com.id === 'wb') return;
      const coords = COORDS[com.id]; if (!coords) return;
      const isSel = com.id === selectedId;
      const m = L.marker(coords, {
        icon: dotIcon(isSel ? dirStyle.bg : '#64748B', isSel ? 14 : 10, isSel),
        zIndexOffset: isSel ? 1000 : 0,
      }).addTo(map)
        .bindTooltip(com.name + (com.miles ? ' · ' + com.miles + ' mi' : ''), { direction: 'right', className: 'map-tip' });
      m.on('click', () => onSelectRef.current(com.id));
      markersRef.current[com.id] = m;
    });

    // Fit map to show all communities with padding — store bounds for reset
    const allCoords = Object.values(COORDS);
    const initialBounds = L.latLngBounds(allCoords);
    map.fitBounds(initialBounds, { padding: [36, 36] });
    boundsRef.current = initialBounds;
    // Restore page scrollability — Leaflet can set overflow:hidden on html/body.
    // Run immediately and after a short delay (tiles can trigger a second override).
    function restoreScroll() {
      document.documentElement.style.overflow = '';
      document.documentElement.style.height   = '';
      document.body.style.overflow            = '';
      document.body.style.height              = '';
    }
    restoreScroll();
    setTimeout(restoreScroll, 50);
    setTimeout(restoreScroll, 300);
    map.invalidateSize();

    mapRef.current = map;
    return () => { map.remove(); mapRef.current = null; markersRef.current = {}; };
  }, []);

  // Update markers on selection change
  useEffect(() => {
    if (!mapRef.current) return;
    communities.forEach(com => {
      if (com.id === 'wb') return;
      const m = markersRef.current[com.id]; if (!m) return;
      const isSel = com.id === selectedId;
      m.setIcon(dotIcon(isSel ? dirStyle.bg : '#64748B', isSel ? 14 : 10, isSel));
      m.setZIndexOffset(isSel ? 1000 : 0);
    });
  }, [selectedId, dirStyle]);

  return (
    <div style={{ borderBottom: "1px solid " + BORDER, position: "relative", zIndex: 0, isolation: "isolate" }}>
      <div ref={containerRef} className="map-container" />
      <button
        onClick={() => boundsRef.current && mapRef.current && mapRef.current.fitBounds(boundsRef.current, { padding: [36, 36] })}
        style={{
          position: "absolute", bottom: 10, right: 10, zIndex: 1000,
          background: "white", border: "1px solid #D1D5DB",
          borderRadius: 6, padding: "4px 10px",
          fontSize: 11, fontWeight: 600, color: "#374151",
          cursor: "pointer", boxShadow: "0 1px 5px rgba(0,0,0,0.14)",
          display: "flex", alignItems: "center", gap: 4,
        }}
      >
        &#8635; Reset view
      </button>
    </div>
  );
}

// ─── SHARED HELPERS ──────────────────────────────────────────────────────────
function Bar({ value, reference, higherBetter = true }) {
  const ratio = higherBetter ? value / reference : reference / value;
  const fill  = Math.min(ratio * 100, 100);
  const color = ratio >= 0.88 ? "#4ADE80" : ratio >= 0.7 ? "#FCD34D" : "#94A3B8";
  return (
    <div style={{ background: "rgba(255,255,255,0.2)", borderRadius: 3, height: 4, marginTop: 3, overflow: "hidden" }}>
      <div style={{ width: fill + "%", height: "100%", background: color, borderRadius: 3 }} />
    </div>
  );
}

function SHead({ label }) {
  return <div style={{ background: "#111827", color: "white", padding: "5px 12px", fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase" }}>{label}</div>;
}

        {valMar}
        {numC != null && numM != null && <Bar value={numM} reference={numM} higherBetter={hib} />}
      </div>
      <div style={{ padding: "7px 10px", background: "white", display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <span style={{ fontWeight: numC != null && numM != null && (hib ? numC >= numM * 0.88 : numC <= numM * 1.12) ? 700 : 400, color: "#111827" }}>{valCom}</span>
        {numC != null && numM != null && <Bar value={numC} reference={numM} higherBetter={hib} />}
        {note && <span style={{ fontSize: 10, color: "#9CA3AF", marginTop: 2 }}>{note}</span>}
      </div>
    </div>
  );
}

function BulletRow({ title, items }) {

// ─── MODE B: Pittsburgh vs Milwaukee rows ─────────────────────────────────────
function RowC({ label, valA, valB, numA, numB, hib=true, note, sub }) {
  const diff = numA != null && numB != null;
  const aWins = diff && (hib ? numA > numB : numA < numB);
  const bWins = diff && (hib ? numB > numA : numB < numA);
  return (
    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr", borderBottom: `1px solid ${BORDER}`, fontSize: 12 }}>
      <div style={{ padding: "7px 12px", background: NEUTRAL, color: "#6B7280", fontSize: 11, fontWeight: 500, display: "flex", flexDirection: "column", justifyContent: "center" }}>
        {label}{sub && <span style={{ fontSize: 10, color: "#9CA3AF" }}>{sub}</span>}
        {note && <span style={{ fontSize: 10, color: "#9CA3AF" }}>{note}</span>}
      </div>
      <div style={{ padding: "7px 10px", background: aWins ? "#EFF6FF" : "white", display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <span style={{ fontWeight: aWins ? 700 : 400, color: aWins ? PGH.color : "#111827", display: "flex", alignItems: "center", gap: 4 }}>
          {aWins && <span style={{ fontSize: 9 }}>▲</span>}{valA}
        </span>
        {diff && <Bar value={numA} reference={Math.max(numA, numB)} higherBetter={hib} />}
      </div>
      <div style={{ padding: "7px 10px", background: bWins ? "#F0FDF4" : "white", display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <span style={{ fontWeight: bWins ? 700 : 400, color: bWins ? MKE.color : "#111827", display: "flex", alignItems: "center", gap: 4 }}>
          {bWins && <span style={{ fontSize: 9 }}>▲</span>}{valB}
        </span>
        {diff && <Bar value={numB} reference={Math.max(numA, numB)} higherBetter={hib} />}
      </div>
    </div>
  );
}

function BulletRowC({ label, itemsA, itemsB }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", borderBottom: `1px solid ${BORDER}`, fontSize: 11 }}>
      <div style={{ padding: "7px 10px", background: "white" }}>

              <RowM label="Healthcare vs. Avg"   valMar="–5% (PA)"  valCom="~–1% (WI)" />
              <RowM label="Transportation"       valMar="+11% (PA)" valCom="+1–2% (WI)" />
              <RowM label="Gallon of Milk"       valMar="~$4.67"    valCom="~$4.10" note="WI is dairy country" />

              <SHead label="Climate" />
              <RowM label="Jan High / Low"    valMar="38°F / 21°F" valCom="26°F / 13°F" />
              <RowM label="July High / Low"   valMar="84°F / 63°F" valCom="82°F / 62°F" />
              <RowM label="Annual Snowfall"   valMar='~27"'         valCom='45–50"' note="More snow than Marshall Twp" />
              <RowM label="Annual Rainfall"   valMar='~41"'         valCom='32–35"' />
              <RowM label="Sunny Days / Year" valMar="~160"         valCom="~185–190" note="More sun than Pittsburgh area" />
              <RowM label="Annual Avg Temp"   valMar="~52°F"        valCom="~49°F" />
              <RowM label="Climate Type"      valMar="Humid Continental" valCom="Humid Continental" />
              {com.id === "kohler" && <RowM label="Lake Michigan Effect" valMar="n/a" valCom="Slight temp moderation near lake" />}

              <SHead label="Crime (2024 FBI UCR)" />
              <RowM label="Overall Crime Rate" sub="per 1,000" valMar="~1 / 1K (very low)" valCom={com.crimeTotal + " / 1K"} numC={com.crimeTotal} numM={MARSHALL.crimeTotal} hib={false} />
              <RowM label="Violent / 100K"     valMar="~10 / 100K"  valCom={com.violent + " / 100K"}  numC={com.violent + 1} numM={MARSHALL.violent + 1} hib={false} />
              <RowM label="Property / 100K"    valMar="~100 / 100K" valCom={com.property + " / 100K"} numC={com.property}    numM={MARSHALL.property}    hib={false} />
              <RowM label="Context"            valMar="Very low — affluent township" valCom={com.crimeVsNatl} />
              <RowM label="WI State Avg (ref)" valMar="n/a" valCom="Violent: 279/100K · Property: 1,154/100K" />

              <SHead label="Schools" />
              <RowM label="School District" valMar="North Allegheny SD" valCom={com.schoolDistrict} />
              <RowM label="Grade / Rating"  valMar="10/10 ✦"           valCom={com.schoolGrade} />
              <RowM label="Ranking / Note"  valMar="#1 in PA region"   valCom={com.schoolNote} />

              <SHead label="Recreation & Outdoors" />
              <BulletRow title="Community Highlights" items={com.recBullets} />
              <div style={{ background: "#F8FAFC", padding: "10px 12px", borderTop: `1px solid ${BORDER}` }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>Shared Regional Recreation</div>
                {["Kettle Moraine State Forest (N & S units) — hiking, biking, XC skiing, kayaking, camping","Ice Age National Scenic Trail — 1,000 mi across WI, multiple access points within 15 min","Milwaukee metro (25–35 min S) — Bucks, Brewers, museums, Summerfest, MKE airport","Lake Michigan — beaches, sailing, fishing, kayaking (Port Washington, Sheboygan, Milwaukee)","Snowmobile & ATV trail networks throughout Washington / Ozaukee / Sheboygan counties"].map((item, i) => (
                  <div key={i} style={{ fontSize: 11, color: "#374151", marginBottom: 2, display: "flex", gap: 5 }}>
                    <span style={{ color: "#9CA3AF", flexShrink: 0 }}>→</span><span>{item}</span>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ background: "#FFFBEB", border: `1px solid #FCD34D`, borderRadius: 8, padding: "10px 14px", marginTop: 10, fontSize: 11, color: "#374151", lineHeight: 1.5 }}>
              <strong>COL note:</strong> Groceries, utilities, gas, healthcare, and transportation are nearly identical across all 8 WI communities. The primary cost driver between them is housing. Wisconsin utilities run significantly below Pennsylvania — a real monthly saving vs. Marshall Township.
            </div>
          </>
        )}

        {/* ── CITY MODE CONTENT ── */}
        {mode === "cities" && <CityComparison />}

        <p style={{ textAlign: "center", fontSize: 10, color: "#9CA3AF", marginTop: 10, lineHeight: 1.5 }}>
          ACS 2024 · FBI UCR 2024 · NOAA NCEI 1991–2020 · Niche 2026 · C2ER COL · NeighborhoodScout · Data USA<br/>
          Map = approximate projection · est. = estimated · ▲ = higher value wins
        </p>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
